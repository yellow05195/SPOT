# One-click back end on Render: connect the GitHub repository as a Blueprint and this file creates
# the database, the quotas store, the claim server (with a disk for photos) and the keeper.
# Secrets marked "sync: false" are typed in the Render dashboard, never in this file.
services:
  - type: web
    name: spot-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: standard            # CLIP needs about 1.5 GB of RAM
    region: frankfurt
    healthCheckPath: /health
    disk:
      name: spot-media
      mountPath: /app/media
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase: { name: spot-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: spot-redis, property: connectionString }
      - key: MODELS_DIR
        value: /app/models
      - key: MEDIA_LOCAL_DIR
        value: /app/media
      - key: PUBLIC_MEDIA_BASE_URL
        sync: false           # https://<this service>.onrender.com/media, then https://api.your-domain/media
      - key: CHAIN_RPC_URL
        value: https://rpc.mainnet.chain.robinhood.com
      - key: CHAIN_ID
        value: "4663"
      - key: VAULT_ADDRESS
        sync: false
      - key: REGISTRY_ADDRESS
        sync: false
      - key: SIGHTINGS_ADDRESS
        sync: false
      - key: ALLOW_HOT_SIGNER
        value: "true"         # launch mode: a hot key signs the vouchers; move to SIGNER_KMS_KEY_ID afterwards
      - key: SIGNER_DEV_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRAGMENTS_ENABLED
        value: "false"        # day one: cards, plates and the map; flip to true once the vault holds inventory
      - key: DAILY_BUDGET_USD
        value: "200"
      - key: TRUSTED_PROXY
        value: "true"

  - type: worker
    name: spot-keeper
    runtime: docker
    dockerfilePath: ./keeper/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    disk:
      name: spot-keeper-state
      mountPath: /app/state
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: spot-db, property: connectionString }
      - key: CHAIN_RPC_URL
        value: https://rpc.mainnet.chain.robinhood.com
      - key: CHAIN_ID
        value: "4663"
      - key: REGISTRY_ADDRESS
        sync: false
      - key: VAULT_ADDRESS
        sync: false
      - key: KEEPER_PRIVATE_KEY
        sync: false
      - key: HUNT_SECRETS_FILE
        value: /app/state/hunt-secrets.json

  - type: keyvalue
    name: spot-redis
    plan: free
    region: frankfurt
    ipAllowList: []           # only reachable from the services above

databases:
  - name: spot-db
    plan: basic-256mb
    region: frankfurt
